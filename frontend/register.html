<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>FitTrack - Create account</title>
  <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="auth-brand">FitTrack</h1>
      <p class="auth-sub">Create a new account</p>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-username">Username</label>
          <input class="form-control" type="text" id="reg-username" name="username" required>
          <span class="form-hint">3 to 20 letters, numbers, or underscores</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-password">Password</label>
          <input class="form-control" type="password" id="reg-password" name="password" required>
          <span class="form-hint">Minimum 6 characters</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-confirm">Confirm password</label>
          <input class="form-control" type="password" id="reg-confirm" name="confirm" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="reg-weight">Weight (kg)</label>
          <input class="form-control" type="number" id="reg-weight" name="weight" step="0.5" min="20" max="300" value="68" required>
          <span class="form-hint">Between 20 and 300 kg</span>
        </div>

        <div style="margin-top: 16px;">
          <button type="submit" class="btn btn-primary btn-full">Create account</button>
        </div>

        <div id="auth-msg" class="msg-line msg-error" style="margin-top: 10px;"></div>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Log in</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js?v=2"></script>
</body>
</html>
