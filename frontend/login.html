<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitTrack - Log in</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <h1 class="brand-title">FitTrack</h1>
      <p class="brand-subtitle">Log in to your account</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input class="form-control" type="text" id="username" name="username" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <div style="margin-top: 16px;">
          <button type="submit" class="btn btn-primary btn-full">Log in</button>
        </div>

        <div id="auth-msg" class="msg-line msg-error" style="margin-top: 10px;"></div>

        <div class="demo-hint">Try the demo: username demo, password demo123</div>

        <div class="auth-footer">
          Don't have an account? <a href="register.html">Create an account</a>
        </div>
      </form>
    </div>
  </div>

  <script src="js/auth.js"></script>
</body>
</html>
